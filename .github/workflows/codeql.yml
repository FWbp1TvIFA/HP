# GitHub code scanning (CodeQL): looks for security problems in the app's JavaScript and in these workflow files.
# Results show under the repository's Security tab > Code scanning. Free for public repositories.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 18 * * 0"   # once a week (Monday morning in Brisbane)

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # to post the results to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - fb.js            # Google's Firebase library, bundled as is
              - "**/node_modules/**"
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
