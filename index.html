<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Home</title>
<meta name="theme-color" content="#A98BFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121027" media="(prefers-color-scheme: dark)">
<meta name="description" content="Family organiser for money, tasks, calendar, shopping, homework, notes, wallet and mood.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="piano.css">
<style>html{color-scheme:light dark}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="hh-only">/* Show only Happy Home's own screens: hide anything a web host adds over the tab bar. */
body>:not(.wrap):not(.tabs):not(#sheetHost):not(#toast):not(script):not(style):not(link):not(noscript),html>:not(head):not(body){display:none!important}</style>
<script>(function(){var ok=function(el){return el.nodeType!==1||/^(SCRIPT|STYLE|LINK|NOSCRIPT|HEAD|BODY|META|TITLE)$/.test(el.tagName)||el.classList.contains("wrap")||el.classList.contains("tabs")||el.id==="sheetHost"||el.id==="toast"};
var hide=function(el){if(!ok(el))el.style.setProperty("display","none","important")};
var watch=function(t){Array.prototype.forEach.call(t.children,hide);new MutationObserver(function(ms){ms.forEach(function(m){Array.prototype.forEach.call(m.addedNodes,hide)})}).observe(t,{childList:true})};
watch(document.documentElement);document.addEventListener("DOMContentLoaded",function(){watch(document.body)})})();</script>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="grow"><h1 id="title">Happy Home</h1><div class="sub" id="subtitle"></div></div>
    <button class="iconbtn" id="btnSearch" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="avatarbtn dot who-0" id="btnProfile" aria-label="Profile"></button>
  </header>
  <main id="view" class="stack"></main>
</div>

<nav class="tabs"><div class="in" style="grid-template-columns:repeat(6,1fr)">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="tab" data-tab="piano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 13v7M15 13v7"/><path d="M7.5 4v9h3V4M13.5 4v9h3V4" fill="currentColor"/></svg>Piano</button>
  <button class="tab" data-tab="lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M14 7h7M14 17h7"/></svg>Lists</button>
  <button class="fab" id="fab" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" id="tabSlot" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button class="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>More</button>
</div></nav>

<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script src="fb.js"></script>
<script src="qr.js"></script>
<script src="firebase-config.js"></script>
<script src="store.js"></script>
<script src="codes.js"></script>
<script src="app.js"></script>
<script src="confetti.js"></script>
<script src="piano.js"></script>
</body></html>
